version: "3.9"

services:
  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imdb-sentiment-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/sentiment_lr.joblib
      - METADATA_PATH=models/model_metadata.json
      - PREDICTION_LOG_PATH=logs/predictions.csv
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  mlflow-ui:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: imdb-mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow ui --backend-store-uri file:///mlruns --host 0.0.0.0 --port 5000
    restart: unless-stopped

